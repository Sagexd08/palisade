# Judgment-layer calibration corpus (seed). Each case is a grounded artifact
# state (the same shape the check sends a backend) plus ground-truth labels.
# Grows over time; every disagreement a real run surfaces becomes a case.
#
# The gate (applied only on a real keyed run): a judged signal is "calibrated"
# when it clears these thresholds on this corpus.
threshold:
  noul_precision: 0.80
  score_within1: 0.80   # ordinal severity/harm: predicted tier within +/-1
  # `gated` is measured but below bar (the model over-predicts gating on this
  # seed); excluded from the hard gate and reported loudly until the corpus and
  # the state given to the model are rich enough to judge it reliably.
  known_weak: [gated]

cases:
  # -- taint exploitability -------------------------------------------------
  - id: expl-sql-exploitable
    check: taint_exploitability
    state:
      rule: PI-SQL
      source: 'question = request.json["question"]  (app.py:24)'
      llm_call: "resp = client.chat.completions.create(  (app.py:25)"
      sink: "cur.execute(model_sql)  (app.py:34)"
      partial_defenses: []
      note: "verified source->LLM->sink; model output executed as raw SQL"
    labels: {exploitable: true, severity: 2}

  - id: expl-exec-critical
    check: taint_exploitability
    state:
      rule: PI-EXEC
      source: 'spec = request.json["spec"]  (app.py:55)'
      llm_call: "resp = client.chat.completions.create(  (app.py:56)"
      sink: "exec(code)  (app.py:63)"
      partial_defenses: []
      note: "model output passed straight to exec()"
    labels: {exploitable: true, severity: 3}

  - id: expl-logged-only-safe
    check: taint_exploitability
    state:
      rule: PI-HTTP
      source: 'q = request.args["q"]  (app.py:10)'
      llm_call: "summary = llm.summarize(q)  (app.py:11)"
      sink: "logger.info(summary)  (app.py:12)"
      partial_defenses: []
      note: "model output is only logged; the 'sink' has no real-world effect"
    labels: {exploitable: false, severity: 0}

  - id: expl-gated-review
    check: taint_exploitability
    state:
      rule: PI-SHELL
      source: 'cmd = request.json["cmd"]  (ops.py:8)'
      llm_call: "plan = llm.plan(cmd)  (ops.py:9)"
      sink: "subprocess.run(plan, shell=True)  (ops.py:20)"
      partial_defenses: ["confirmation_gate"]
      note: "a human confirmation gate sits on the path; still bypassable in real CVEs"
    labels: {exploitable: true, severity: 2}

  # -- excessive agency -----------------------------------------------------
  # `guard_facts` is the structural addition (see semantic/probe.py
  # CapabilityHit.guarded / semantic/judge.py excessive_agency_state): for
  # each call, whether the IR proved it sits inside an `if`, and that if's
  # condition text. Cases below without a real gate now say so explicitly
  # (`guarded_by_if: false`) instead of leaving `gated` to be inferred from a
  # bare call-site snippet.
  - id: agency-delete-ungated
    check: excessive_agency
    state:
      tool_name: delete_account
      stated_purpose: "Permanently delete a user's data."
      capabilities_detected: [file_write]
      dangerous_call_sites: ["shutil.rmtree  ->  shutil.rmtree(f'/data/{user_id}')"]
      guard_facts:
        - call: shutil.rmtree
          guarded_by_if: false
          if_condition: ""
    labels: {irreversible: true, gated: false, harm: 3}

  - id: agency-charge-ungated
    check: excessive_agency
    state:
      tool_name: charge_card
      stated_purpose: "Charge a customer's card."
      capabilities_detected: [payments]
      dangerous_call_sites: ["stripe.PaymentIntent.create  ->  stripe.PaymentIntent.create(...)"]
      guard_facts:
        - call: stripe.PaymentIntent.create
          guarded_by_if: false
          if_condition: ""
    labels: {irreversible: true, gated: false, harm: 3}

  - id: agency-format-benign
    check: excessive_agency
    state:
      tool_name: format_name
      stated_purpose: "Pure string formatting; no side effects."
      capabilities_detected: []
      dangerous_call_sites: []
      guard_facts: []
    labels: {irreversible: false, gated: false, harm: 0}

  - id: agency-read-only
    check: excessive_agency
    state:
      tool_name: get_forecast
      stated_purpose: "Look up the weather for a city (read-only HTTP GET)."
      capabilities_detected: [network]
      dangerous_call_sites: ["requests.get  ->  requests.get(f'https://api/{city}')"]
      guard_facts:
        - call: requests.get
          guarded_by_if: false
          if_condition: ""
    labels: {irreversible: false, gated: false, harm: 1}

  # Positive `gated` examples: the destructive action sits behind an explicit
  # human confirmation / approval, so `gated` should be yes.
  - id: agency-refund-gated
    check: excessive_agency
    state:
      tool_name: issue_refund
      stated_purpose: "Refund an order, but only after explicit human approval."
      capabilities_detected: [payments]
      dangerous_call_sites:
        - "stripe.Refund.create  ->  if require_human_approval(order): stripe.Refund.create(order)"
      guard_facts:
        - call: stripe.Refund.create
          guarded_by_if: true
          if_condition: "if require_human_approval(order):"
    labels: {irreversible: true, gated: true, harm: 3}

  - id: agency-deploy-gated
    check: excessive_agency
    state:
      tool_name: deploy_release
      stated_purpose: "Deploy to production after a confirmation prompt; dry-run by default."
      capabilities_detected: [shell]
      dangerous_call_sites:
        - "subprocess.run  ->  if confirm('deploy to prod?'): subprocess.run(cmd, shell=True)"
      guard_facts:
        - call: subprocess.run
          guarded_by_if: true
          if_condition: "if confirm('deploy to prod?'):"
    labels: {irreversible: true, gated: true, harm: 3}

  # -- adversarial: the two shapes that drove `gated` precision to 0.67 -----
  # A docstring/purpose that CLAIMS gating, but the structural fact says the
  # call is unconditional. Real regression: a stale docstring, or approval
  # logic that was removed without updating the comment. gated must be false
  # - guard_facts, not stated_purpose, is the ground truth.
  - id: agency-stale-docstring-claims-gate
    check: excessive_agency
    state:
      tool_name: wipe_bucket
      stated_purpose: "Deletes an S3 bucket. Requires manager approval before running."
      capabilities_detected: [cloud]
      dangerous_call_sites: ["*.delete_object  ->  bucket.delete_object(key)"]
      guard_facts:
        - call: "*.delete_object"
          guarded_by_if: false
          if_condition: ""
    labels: {irreversible: true, gated: false, harm: 3}

  # A real `if` enclosing the call, but its condition is unrelated to
  # approval (a permission check, a retry count) - not a confirmation gate.
  - id: agency-unrelated-if-is-not-a-gate
    check: excessive_agency
    state:
      tool_name: charge_card_admin_only
      stated_purpose: "Charge a customer's card. Admins only."
      capabilities_detected: [payments]
      dangerous_call_sites:
        - "stripe.PaymentIntent.create  ->  if user.is_admin: stripe.PaymentIntent.create(amount)"
      guard_facts:
        - call: stripe.PaymentIntent.create
          guarded_by_if: true
          if_condition: "if user.is_admin:"
    labels: {irreversible: true, gated: false, harm: 3}
