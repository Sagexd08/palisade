         code: "return subprocess.check_output(command, shell=True).decode(\"utf-8\")"}
      - {file: libs/agno/agno/tools/code/kernel.py, line: 614, capability: exec, verdict: flag, group: a,
         mitigation: "none; allow_shell=False only strips shell magics and is documented as not a security boundary",
         code: "msg_id = self.kc.execute(code, silent=False, store_history=True, allow_stdin=False, stop_on_error=True)"}
      - {file: libs/agno/agno/tools/coding.py, line: 628, capability: shell, verdict: flag, group: a,
         mitigation: "enable_run_shell default False (on in the in-repo wiring); with restrict_to_base_dir=True the command is allowlisted, interpreter -c forms rejected, no shell",
         code: "result = subprocess.run("}
      - {file: libs/agno/agno/tools/crawl4ai.py, line: 120, capability: http, verdict: flag, group: a,
         mitigation: "none",
         code: "result = await crawler.arun(url=url, config=config)"}
      - {file: libs/agno/agno/tools/daytona.py, line: 264, capability: exec, verdict: flag, group: a,
         mitigation: "runs in a remote Daytona sandbox",
         code: "response = current_sandbox.process.code_run(code)"}
      - {file: libs/agno/agno/tools/docker.py, line: 352, capability: exec, verdict: flag, group: a,
         mitigation: "runs inside a container, but both container id and command come from the model",
         code: "exit_code, output = container.exec_run(command)"}
      - {file: libs/agno/agno/tools/duckdb.py, line: 140, capability: sql, verdict: flag, group: a,
         mitigation: "backticks stripped and only the first semicolon-separated statement is run",
         code: "query_result = self.connection.sql(formatted_sql)"}
      - {file: libs/agno/agno/tools/e2b.py, line: 102, capability: exec, verdict: flag, group: a,
         mitigation: "runs in a remote E2B sandbox",
         code: "execution = self.sandbox.run_code(executable_code)"}
      - {file: libs/agno/agno/tools/postgres.py, line: 127, capability: sql, verdict: flag, group: a,
         mitigation: "none; params is None on this path and the statement text is model-built",
         code: "cursor.execute(query, params)"}
      - {file: libs/agno/agno/tools/python.py, line: 202, capability: exec, verdict: flag, group: a,
         mitigation: "none by default; requires_confirmation_tools exists but the in-repo wiring leaves execution ungated",
         code: "exec(code, self.safe_globals, self.safe_locals)"}
      - {file: libs/agno/agno/tools/redshift.py, line: 207, capability: sql, verdict: flag, group: a,
